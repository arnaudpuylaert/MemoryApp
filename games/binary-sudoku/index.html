<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b1e5c">
  <title>Binaire Sudoku</title>
  <link rel="manifest" href="../../manifest.json">
  <link rel="icon" href="../../icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Brainrot Tool">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../base.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gate" class="gate-overlay">
    <form id="gate-form" class="gate-form">
      <p class="gate-label">Wachtwoord vereist</p>
      <input type="password" id="gate-password" placeholder="Wachtwoord" autocomplete="current-password" autofocus>
      <button type="submit">Ontgrendel</button>
      <p class="gate-error" id="gate-error"></p>
    </form>
  </div>

  <div id="app-content" hidden>
    <a class="back-link" href="../../index.html">← Terug naar menu</a>
    <h1>Binaire Sudoku</h1>
    <p class="rules">
      Vul elk vakje met 0 of 1. Elke rij en kolom heeft evenveel 0'en als 1'en,
      nooit 3 dezelfde naast elkaar, en geen twee identieke rijen of kolommen.
    </p>
    <p id="status">Vul de ontbrekende cijfers in.</p>

    <div id="board"></div>

    <div class="controls">
      <button id="check-btn">Controleer</button>
      <button id="new-btn">Nieuwe puzzel</button>
    </div>
  </div>

  <script src="../../gate.js"></script>
  <script src="../../stats.js"></script>
  <script src="script.js"></script>
</body>
</html>
